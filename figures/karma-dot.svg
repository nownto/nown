<svg viewBox="0 0 680 320" role="img" aria-label="Karma DOT as the slope of the line from the origin to a key's score today. A key's karma is a step that rises on successes and falls on a failure, reaching its score today. Karma DOT is that score divided by the blocks the key has been alive, which is the slope of the straight line from the first block to now. Idle blocks extend the span without raising the score, so the line flattens and the density falls." xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto">
  <style>
    .ax{ fill:none; stroke:var(--ink-3,#726c60); stroke-width:1 }
    .axl{ font-family:var(--serif,Georgia,serif); font-size:15px; fill:var(--ink-3,#726c60); font-style:italic }
    .step{ fill:none; stroke:var(--bronze,#9c7635); stroke-width:2 }
    .ev{ font-family:var(--mono,monospace); font-size:14px; fill:var(--ink,#1b1a16) }
    .idle{ font-family:var(--serif,Georgia,serif); font-size:14px; fill:var(--ink-3,#726c60); font-style:italic }
    .chord{ fill:none; stroke:var(--ink-2,#46423a); stroke-width:1.6; stroke-dasharray:6 4 }
    .today{ fill:none; stroke:var(--ink-3,#726c60); stroke-width:1; stroke-dasharray:2 3 }
    .lbl{ font-family:var(--serif,Georgia,serif); font-size:15px; fill:var(--ink,#1b1a16) }
    .dot{ font-family:var(--mono,monospace); font-size:16px; fill:var(--bronze,#9c7635); font-weight:600 }
    .brace{ fill:none; stroke:var(--ink-3,#726c60); stroke-width:1 }
  </style>

  <!-- axes -->
  <path class="ax" d="M60,250 L60,46"/><polygon points="60,40 56,50 64,50" fill="var(--ink-3,#726c60)"/>
  <path class="ax" d="M60,250 L498,250"/><polygon points="504,250 494,246 494,254" fill="var(--ink-3,#726c60)"/>
  <text class="axl" x="30" y="150" transform="rotate(-90 30 150)" text-anchor="middle">karma</text>

  <!-- the chord from the origin to today: its slope is Karma DOT -->
  <path class="chord" d="M60,250 L465,78"/>

  <!-- karma as a step: rises on success, falls on failure -->
  <path class="step" d="M60,250 L106,250 L106,164 L206,164 L206,107 L265,107 L265,164 L386,164 L386,107 L423,107 L423,78 L465,78"/>
  <circle cx="465" cy="78" r="4.5" fill="var(--ink,#1b1a16)"/>

  <!-- events -->
  <text class="ev" x="110" y="150">+ success</text>
  <text class="ev" x="210" y="98">+ success</text>
  <text class="ev" x="269" y="185">&#8722; failure</text>
  <text class="idle" x="415" y="185" text-anchor="middle">idle</text>

  <!-- karma today -->
  <path class="today" d="M64,78 L465,78"/>
  <text class="lbl" x="66" y="70">karma today</text>

  <!-- blocks alive brace -->
  <path class="brace" d="M60,264 q0,7 7,7 L259,271 q7,0 7,7 q0,-7 7,-7 L458,271 q7,0 7,-7"/>
  <text class="axl" x="262" y="296" text-anchor="middle">blocks alive</text>

  <!-- the arithmetic, to the right -->
  <text class="dot" x="524" y="120">Karma DOT</text>
  <line x1="524" y1="140" x2="662" y2="140" stroke="var(--ink,#1b1a16)" stroke-width="1"/>
  <text class="lbl" x="530" y="132">karma today</text>
  <text class="lbl" x="530" y="160">blocks alive</text>
  <text class="idle" x="524" y="196">the slope of the</text>
  <text class="idle" x="524" y="214">line from the</text>
  <text class="idle" x="524" y="232">first block to now:</text>
  <text class="idle" x="524" y="256">idle blocks widen</text>
  <text class="idle" x="524" y="274">the span and</text>
  <text class="idle" x="524" y="292">flatten it</text>
</svg>
